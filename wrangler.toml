# wrangler.toml
name              = "camp-alloc-v4"
main              = "workers/worker.js"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding       = "DB"
database_name = "campallocation"
database_id   = "83a648ba-9758-4001-abb1-7ec6e3d50ec6"

# Secrets — set in Cloudflare dashboard (Worker → Settings → Variables and Secrets):
#   APP_PASSWORD  — login password (e.g. kmetgroup123!)
#   TOKEN_SECRET  — random 32+ char string for signing session tokens
